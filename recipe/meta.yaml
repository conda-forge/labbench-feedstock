{% set name = "labbench" %}
{% set version = "0.46.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/labbench-{{ version }}.tar.gz
  sha256: 8c0b14b198669b0e577055be880c2709e430f9f79451e7a36b44c080d853cea4

build:
  entry_points:
    - labbench = labbench.cli.__main__:do_cli
  number: 0
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - psutil >=5.0
    - validators >=0.20.0
    - pip
    - typing-extensions >=4.8.0
    - click >=8.0,<9.dev0
    - dulwich >=0.20
    - numpy >=1.19
    - pandas >=1.2.0
    - ruamel.yaml >=0.17.21
    - feather-format >=0.4.0
    - sqlalchemy >=1.4
    - pyarrow >=14
    - pyserial >=3.0
    - pyvisa >=1.8
    - pyvisa-py >=0.6
    - pyusb
    - pyvisa-sim >=0.5.1
    - pywin32   # [win]
    - comtypes  # [win]
    - libusb
    - libusb1 >=3.1.0
    - __unix    # [unix]
    - __win     # [win]

test:
  imports:
    - {{ name }}
    - labbench.testing
  commands:
    # skip `pip check` due to mismatched pypi/conda package names
    - labbench --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: The `labbench` module provides API tools to support python scripting for laboratory automation.The goal is to simplify the process of developing an experimental procedure into clear, concise, explainable, and reusable code.
  license: NIST-PD
  license_file: LICENSE.md
  home: https://github.com/usnistgov/labbench
  doc_url: https://pages.nist.gov/labbench/

extra:
  recipe-maintainers:
    - dgkuester-nist
